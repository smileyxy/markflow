name: Release & Sync Chrome Web Store

on:
  push:
    tags:
      - "v*.*.*"
  workflow_call:
    inputs:
      tag_name:
        description: "目标版本标签（例如 v1.0.1）"
        required: true
        type: string
      publish_cws:
        description: "配置 Secrets 后自动上传并提交至 Chrome Web Store"
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      tag_name:
        description: "要发布的版本标签（留空则读取 manifest.json 版本）"
        required: false
        default: ""
        type: string
      publish_cws:
        description: "同步上传并提交审核至 Chrome Web Store"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build, Release & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Resolve target ref
        id: resolve_ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_call" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG=""
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_ref.outputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate manifest version and JavaScript syntax
        id: meta
        run: |
          VERSION=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("manifest.json","utf8")).version)')
          TAG="${{ steps.resolve_ref.outputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v${VERSION}"
          fi
          EXPECTED_TAG="v${VERSION}"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Tag (${TAG}) 与 manifest.json 版本号 (${EXPECTED_TAG}) 不一致！"
            exit 1
          fi

          find background shared popup options -name "*.js" -print0 | xargs -0 -n1 node --check
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "zip_name=markflow-v${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Build clean Chrome extension package
        run: |
          mkdir -p dist
          zip -r "dist/${{ steps.meta.outputs.zip_name }}" \
            manifest.json \
            _locales \
            icons \
            background \
            shared \
            popup \
            options \
            -x "*.DS_Store" "*Thumbs.db" "*desktop.ini"
          ls -lh "dist/${{ steps.meta.outputs.zip_name }}"

      - name: Extract changelog notes
        id: notes
        env:
          VER: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          node <<'EOF'
          const fs = require("fs");
          const { execSync } = require("child_process");

          const ver = process.env.VER;
          const tag = process.env.TAG;
          const repo = process.env.REPO || "smileyxy/markflow";

          function git(cmd) {
            try {
              return execSync(cmd, { encoding: "utf8" }).trim();
            } catch (e) {
              return "";
            }
          }

          // 1. 提取 CHANGELOG.md 中对应版本的主要更新内容（含高亮与分类条目）
          const md = fs.existsSync("CHANGELOG.md")
            ? fs.readFileSync("CHANGELOG.md", "utf8").replace(/\r\n/g, "\n")
            : "";
          const escaped = ver.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const startRe = new RegExp(`^## \\[${escaped}\\][^\\n]*\\n`, "m");
          const startMatch = startRe.exec(md);
          let changelogBody = `MarkFlow AI v${ver} 正式发布 / Official release of MarkFlow AI v${ver}.`;
          if (startMatch) {
            const rest = md.slice(startMatch.index + startMatch[0].length);
            const nextIdx = rest.search(/^## \[/m);
            const sliced = nextIdx === -1 ? rest : rest.slice(0, nextIdx);
            if (sliced.trim()) changelogBody = sliced.trim();
          }

          // 2. 自动定位上一个版本 tag 并汇总合并提交与变更差异（紧凑版，不附折叠 diff --stat）
          const tags = git('git tag --list "v*" --sort=-v:refname')
            .split(/\r?\n/)
            .map(s => s.trim())
            .filter(t => /^v\d+\.\d+\.\d+$/.test(t) && t !== tag);
          const prevTag = tags[0] || "";

          const sections = [changelogBody];
          if (prevTag) {
            const count = git(`git rev-list --count ${prevTag}..${tag}`) || "0";
            const shortstat = git(`git diff --shortstat ${prevTag} ${tag}`);
            const rawLog = git(`git log ${prevTag}..${tag} --pretty=format:%h%x09%H%x09%s`);
            const commitLines = rawLog
              ? rawLog
                  .split(/\r?\n/)
                  .filter(Boolean)
                  .slice(0, 30)
                  .map(line => {
                    const [shortSha, fullSha, ...rest] = line.split("\t");
                    const subject = rest.join("\t");
                    return `- ${subject} ([\`${shortSha}\`](https://github.com/${repo}/commit/${fullSha}))`;
                  })
              : [];

            sections.push("---");
            sections.push(`### 🔀 代码合并与变更摘要 / Merged Changes (\`${prevTag}\` → \`${tag}\`)`);
            const metaParts = [`**Commits:** ${count}`];
            if (shortstat) metaParts.push(`**Diff:** \`${shortstat}\``);
            sections.push(`- ${metaParts.join(" · ")}`);
            if (commitLines.length > 0) {
              sections.push(...commitLines);
            }
            sections.push("");
            sections.push(`**Full Changelog**: https://github.com/${repo}/compare/${prevTag}...${tag}`);
          } else {
            const firstCommit = git("git rev-list --max-parents=0 HEAD | tail -n 1");
            const count = git(`git rev-list --count ${tag}`) || "1";
            sections.push("---");
            sections.push(`### 🔀 代码变更摘要 / Changes (\`${tag}\`)`);
            sections.push(`- **Commits:** ${count}${firstCommit ? ` · **Initial:** \`${firstCommit.slice(0, 7)}\`` : ""}`);
          }

          fs.writeFileSync("release-notes.md", sections.join("\n") + "\n", "utf8");
          EOF

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          ZIP_PATH="dist/${{ steps.meta.outputs.zip_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_PATH" --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$ZIP_PATH" \
              --title "MarkFlow AI ${TAG}" \
              --notes-file release-notes.md
          fi

      - name: Upload & publish to Chrome Web Store
        id: cws
        if: ${{ github.event_name == 'push' || inputs.publish_cws == true }}
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          ZIP_PATH: dist/${{ steps.meta.outputs.zip_name }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          ZIP_NAME: ${{ steps.meta.outputs.zip_name }}
        run: |
          node <<'EOF'
          const fs = require("fs");

          async function main() {
            const {
              CWS_EXTENSION_ID: extId,
              CWS_CLIENT_ID: clientId,
              CWS_CLIENT_SECRET: clientSecret,
              CWS_REFRESH_TOKEN: refreshToken,
              ZIP_PATH: zipPath,
              RELEASE_TAG: releaseTag,
              ZIP_NAME: zipName,
              GITHUB_OUTPUT: ghOutput,
              GITHUB_STEP_SUMMARY: ghSummary
            } = process.env;

            if (!extId || !clientId || !clientSecret || !refreshToken) {
              if (ghOutput) fs.appendFileSync(ghOutput, "status=skipped\n");
              if (ghSummary) {
                fs.appendFileSync(
                  ghSummary,
                  [
                    "### Chrome Web Store 自动同步已跳过",
                    "未检测到完整的商店 API Secrets（`CWS_EXTENSION_ID` / `CWS_CLIENT_ID` / `CWS_CLIENT_SECRET` / `CWS_REFRESH_TOKEN`）。",
                    `GitHub Release（\`${zipName}\`）已正常发布；配置好 Secrets 后可随时手动重新运行本工作流完成商店自动提交。`
                  ].join("\n") + "\n"
                );
              }
              return;
            }

            const tokenResp = await fetch("https://oauth2.googleapis.com/token", {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: new URLSearchParams({
                client_id: clientId,
                client_secret: clientSecret,
                refresh_token: refreshToken,
                grant_type: "refresh_token"
              })
            });
            const tokenData = await tokenResp.json().catch(() => ({}));
            if (!tokenResp.ok || !tokenData.access_token) {
              console.error("OAuth token exchange failed:", {
                httpStatus: tokenResp.status,
                error: tokenData.error || "unknown_error",
                error_description: tokenData.error_description || ""
              });
              process.exit(1);
            }

            const accessToken = String(tokenData.access_token);
            console.log(`::add-mask::${accessToken}`);

            const zipBuffer = fs.readFileSync(zipPath);
            const uploadResp = await fetch(
              `https://www.googleapis.com/upload/chromewebstore/v1.1/items/${encodeURIComponent(extId)}`,
              {
                method: "PUT",
                headers: {
                  Authorization: `Bearer ${accessToken}`,
                  "x-goog-api-version": "2"
                },
                body: zipBuffer
              }
            );
            const uploadData = await uploadResp.json().catch(() => ({}));
            console.log("Upload status:", JSON.stringify({
              httpStatus: uploadResp.status,
              uploadState: uploadData.uploadState,
              itemError: uploadData.itemError || []
            }));
            if (!uploadResp.ok || uploadData.uploadState !== "SUCCESS") {
              console.error("Chrome Web Store upload failed.");
              process.exit(1);
            }

            const publishResp = await fetch(
              `https://www.googleapis.com/chromewebstore/v1.1/items/${encodeURIComponent(extId)}/publish?publishTarget=default`,
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${accessToken}`,
                  "x-goog-api-version": "2",
                  "Content-Length": "0"
                }
              }
            );
            const publishData = await publishResp.json().catch(() => ({}));
            console.log("Publish status:", JSON.stringify({
              httpStatus: publishResp.status,
              status: publishData.status,
              statusDetail: publishData.statusDetail
            }));
            if (!publishResp.ok || !Array.isArray(publishData.status) || !publishData.status.includes("OK")) {
              console.error("Chrome Web Store publish failed.");
              process.exit(1);
            }

            if (ghOutput) fs.appendFileSync(ghOutput, "status=published\n");
            if (ghSummary) {
              fs.appendFileSync(
                ghSummary,
                [
                  "### Chrome Web Store 自动同步成功",
                  `- 版本：\`${releaseTag}\``,
                  "- 状态：已自动上传并提交 Chrome 商店审核"
                ].join("\n") + "\n"
              );
            }
          }

          main().catch(err => {
            console.error("Unexpected publish error:", err && err.message ? err.message : String(err));
            process.exit(1);
          });
          EOF
